name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            exe: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev
      - name: Test
        shell: bash
        run: cargo test --locked --target "${{ matrix.target }}"
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Stage binary and font licenses
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          mkdir -p package
          cp "target/${TARGET}/release/fractal${EXE}" package/
          cp assets/fonts/LICENSE-NotoSans.txt assets/fonts/LICENSE-NotoSansCJK.txt package/
          test -s "package/fractal${EXE}"
          test -s package/LICENSE-NotoSans.txt
          test -s package/LICENSE-NotoSansCJK.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fractal-${{ matrix.target }}
          path: package/
          if-no-files-found: error
